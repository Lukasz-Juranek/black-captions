name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pinned so the image doesn't change under us (ubuntu-latest moves to 26.04).
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # v5, not v6: v6's caching component needs accepting Gradle's commercial terms.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Decode signing key
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build
        env:
          SIGNING_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Retried: GitHub/Gradle downloads sometimes fail with 5xx errors.
          for attempt in 1 2 3; do
            gradle assembleRelease --no-daemon && break
            [ "$attempt" = 3 ] && exit 1
            echo "Build failed, retrying in 30 s"; sleep 30
          done
          mv app/build/outputs/apk/release/app-release.apk BlackCaptions.apk

      - uses: actions/upload-artifact@v7
        with:
          name: BlackCaptions
          path: BlackCaptions.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" BlackCaptions.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}"
