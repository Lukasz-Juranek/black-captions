name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode signing key
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build
        env:
          SIGNING_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk BlackCaptions.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BlackCaptions
          path: BlackCaptions.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" BlackCaptions.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}"
